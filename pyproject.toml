[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "buaa-badminton-booking"
version = "0.1.0"
description = "BUAA badminton reservation assistant with an iPhone control page"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "keyring>=25,<27",
  "numpy>=1.26,<3",
  "opencv-python>=4.8,<5",
  "Pillow>=10,<13",
  "playwright>=1.52,<2",
  "rapidocr-onnxruntime>=1.3,<2",
  "tzdata>=2024.1",
]

[project.scripts]
buaa-booking = "buaa_booking.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

